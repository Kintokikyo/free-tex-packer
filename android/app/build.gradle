plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dedigame.freetexpacker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dedigame.freetexpacker'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.6.7'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
