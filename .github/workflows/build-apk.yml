name: Build Free Texture Packer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Build web app
        run: npm run build-web

      - name: Copy web app into Android assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -r dist/web/. android/app/src/main/assets/web/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Free-Texture-Packer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
